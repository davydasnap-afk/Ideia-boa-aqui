<!DOCTYPE html>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Você ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom, #ff9a9e, #fad0c4);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: #fff;
    }

    .container {
      padding: 20px;
      max-width: 400px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 28px;
    }

    p {
      font-size: 18px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: #ff4b5c;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #ff1e3c;
    }

    .heart {
      font-size: 40px;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Oi, minha querida 💖</h1>
    <p id="mensagem">Você é muito especial para mim...</p>
    <div class="heart">❤️</div>
    <button onclick="mostrarMensagem()">Clique aqui</button>
  </div>

  <script>
    function mostrarMensagem() {
      const mensagens = [
        "Você ilumina meus dias ☀️",
        "Seu sorriso é lindo 😍",
        "Eu adoro conversar com você 💬",
        "Você é incrível do seu jeito 💕",
        "Nunca se esqueça do quanto você é especial 💖"
      ];

      const mensagem = mensagens[Math.floor(Math.random() * mensagens.length)];
      document.getElementById("mensagem").innerText = mensagem;
    }
  </script>

</body>
</html>
